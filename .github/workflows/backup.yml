name: Encrypted complete backup
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vacaynanny-complete-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.repository == vars.OPERATIONS_REPOSITORY
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.BACKUP_SUPABASE_ACCESS_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: https://eejvcawtqkpucqgsaqzp.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BACKUP_SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_APP_ENCRYPTION_KEY: ${{ secrets.BACKUP_APP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:backup:complete -- --project-ref=eejvcawtqkpucqgsaqzp
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: vacaynanny-encrypted-backup-${{ github.run_id }}
          path: artifacts/complete-backups/
          if-no-files-found: error
          retention-days: 30
